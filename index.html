<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.459), rgba(0, 0, 0, 0.36)), url("https://i1-c.pinimg.com/736x/e5/fd/f0/e5fdf085ace60a9ecbea90ffc76f071d.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }
        
        .title {
            text-align: center;
            padding-top: 40px;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .search-box {
            max-width: 400px;
            margin: auto;
        }
        
        .search-box input {
            border-radius: 50px;
            padding: 12px 20px;
            border: none;
        }
        
        .character-card {
            background: rgba(0, 0, 0, 0.741);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            height: 100%;
        }
        
        .character-card:hover {
            transform: translateY(-10px) scale(1.03);
        }
        
        .character-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin: auto;
        }
        
        .character-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .info {
            margin-top: 10px;
            color: #ddd;
        }
        
        .info span {
            color: #ffc107;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            margin-top: 100px;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                DRAGON BALL API
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 text-center mb-4">
                <h1 class="title">
                    DRAGON BALL HEROES
            </div>
            <div class="col-12 col-xl-5 col-md-6 col-lg-6 col-sm-6 mb-5 ">
                <div class="card bg-dark bg-opacity-50 border-0 rounded-5 shadow p-3 ">
                    <input type="text" class="form-control rounded-pill" id="searchInput" placeholder="Search character...">
                </div>
            </div>
        </div>
        <div class="row g-4" id="characterContainer">
            <div class="col-12" id="caracterContainer">
                <div class="loading text-center">
                    Loading characters...
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById("characterContainer");
        const searchInput = document.getElementById("searchInput");
        let characters = [];

        async function fetchCharacters() {

            try {

                const response = await fetch(
                    "https://dragonball-api.com/api/characters?limit=20"
                );
                const data = await response.json();
                characters = data.items;
                displayCharacters(characters);
            } catch (error) {
                container.innerHTML = `
                    <div class="col-12">
                        <h2 class="text-center text-danger">
                            Failed to load API data
                        </h2>
                    </div>
                `;
                console.log(error);
            }
        }

        function displayCharacters(data) {
            container.innerHTML = "";
            data.forEach(character => {
                const card = document.createElement("div");
                card.className = `
                    col-12
                    col-sm-6
                    col-md-4
                    col-lg-3
                `;
                card.innerHTML = `
                    <div class="character-card h-100">
                        <img src="${character.image}"
                             class="character-img img-fluid">
                        <div class="character-name">
                            ${character.name}
                        </div>
                        <div class="info">
                            <span>Race:</span>
                            ${character.race || "Unknown"}
                        </div>
                        <div class="info">
                            <span>Ki:</span>
                            ${character.ki || "N/A"}
                        </div>
                        <div class="info">
                            <span>Affiliation:</span>
                            ${character.affiliation || "Unknown"}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        searchInput.addEventListener("input", () => {
            const value = searchInput.value.toLowerCase();
            const filtered = characters.filter(character => {
                return character.name
                    .toLowerCase()
                    .includes(value);

            });
            displayCharacters(filtered);
        });


        fetchCharacters();
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
